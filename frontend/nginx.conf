server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build files never change: cache them for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # React Router routes (/tasks, /wiki/...) have no file: serve the app and let it route.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
