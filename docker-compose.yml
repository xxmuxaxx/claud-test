# Whole app for local development: PostgreSQL + backend + frontend.
# Start with `docker compose up --build`, then open http://localhost:5173.
# (For day-to-day frontend work you can run only `db` and `backend` here and use `npm run dev` in frontend/.)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?schema=public
      # The origin the frontend is opened from (see FRONTEND_PORT below).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      # Fill an empty database with demo tasks and articles (existing data is never touched).
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: ./frontend
      args:
        # The address the browser uses to reach the backend (the published backend port).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-3000}/api/v1}
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-5173}:80'

volumes:
  pgdata:
